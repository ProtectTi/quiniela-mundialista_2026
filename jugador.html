<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiniela Mundialista 2026</title>
  <meta name="description" content="Regístrate o inicia sesión para participar en la quiniela del Mundial FIFA 2026. Predice los resultados y compite con tus amigos." />
  <meta property="og:title" content="Quiniela Mundialista 2026" />
  <meta property="og:description" content="Regístrate o inicia sesión para participar en la quiniela del Mundial FIFA 2026. Predice los resultados y compite con tus amigos." />
  <meta property="og:image" content="img/logo.webp" onerror="this.src='img/logo.webp' onerror="this.src='img/logo.png'"" />
  <meta property="og:type" content="website" />
  <meta name="theme-color" content="#1a1a2e" />

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <!-- Estilos propios -->
  <link rel="stylesheet" href="css/jugador.css" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="img/logo.webp" onerror="this.src='img/logo.webp' onerror="this.src='img/logo.png'"" />
</head>
<body>

  <div class="wrapper">
    <div class="auth-card">

      <!-- Título -->
      <h1 class="brand-title">
        <span class="gold">Quiniela</span><span class="mexico">Mundialista</span>
      </h1>
      <p class="brand-sub">Copa Mundial de la FIFA 2026</p>

      <!-- Tabs -->
      <div class="nav-tabs-custom" role="tablist">
        <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Iniciar sesión</button>
        <button class="tab-btn" id="tab-register" onclick="switchTab('register')">Registrarse</button>
      </div>

      <!-- Alerta -->
      <div class="alert-custom" id="alertMsg"></div>

      <!-- ── FORMULARIO REGISTRO ── -->
      <div id="form-register" style="display:none;">
        <div class="mb-field">
          <label class="form-label-custom">Nombre completo</label>
          <input type="text" class="input-custom" id="reg-nombre" placeholder="Ej: Juan Pérez" maxlength="50" autocomplete="off" />
        </div>
        <div class="mb-field">
          <label class="form-label-custom">Usuario</label>
          <input type="text" class="input-custom" id="reg-usuario" placeholder="Ej: juanp26 (sin espacios)" maxlength="30" autocomplete="off" />
          <small class="input-hint">Solo letras, números y guión bajo. Lo usarás para entrar.</small>
        </div>
        <div class="mb-field">
          <label class="form-label-custom">Contraseña</label>
          <input type="password" class="input-custom" id="reg-pass" placeholder="Mínimo 4 caracteres" maxlength="30" />
        </div>
        <div class="mb-field">
          <label class="form-label-custom">Confirmar contraseña</label>
          <input type="password" class="input-custom" id="reg-pass2" placeholder="Repite tu contraseña" maxlength="30" />
        </div>
        <button class="btn-gold" id="btn-register" onclick="registrar()">Crear cuenta</button>
      </div>

      <!-- ── FORMULARIO LOGIN ── -->
      <div id="form-login">
        <div class="mb-field">
          <label class="form-label-custom">Usuario</label>
          <input type="text" class="input-custom" id="login-usuario" placeholder="Tu usuario" maxlength="30" autocomplete="off" />
        </div>
        <div class="mb-field">
          <label class="form-label-custom">Contraseña</label>
          <input type="password" class="input-custom" id="login-pass" placeholder="Tu contraseña" maxlength="30" />
        </div>
        <button class="btn-gold" id="btn-login" onclick="iniciarSesion()">Entrar</button>
        <div class="text-center mt-3">
          <a href="reset.html" class="btn-reset-link">¿Olvidaste tu contraseña?</a>
        </div>
      </div>

    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Lógica Firebase -->
  <script type="module" src="js/jugador.js"></script>


  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
